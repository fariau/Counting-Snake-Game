<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Counting Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4F5FF; --grid:rgba(59,130,246,.14); --doodle-o:.5;
  --text:#2B2A4C; --outline:#2B2A4C; --muted:#6B6A8F;
  --grass-a:#BDEE8F; --grass-b:#A9E17C;
  --card:#FFFFFF; --chip:#ECEEFF; --shadow:rgba(43,42,76,.28);
  --pink:#FF5C8A; --orange:#FF8A3D; --yellow:#FFC93C; --violet:#8B5CF6; --blue:#3B82F6; --green:#22B45A;
  --hud-h:88px; --pad-h:clamp(64px,11vh,104px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1E2364; --grid:rgba(255,255,255,.07); --doodle-o:.32; --text:#FFFFFF; --muted:#B9BBF0;
    --grass-a:#4BA35E; --grass-b:#419656; --card:#2B2F6B; --chip:#3C4194; --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#1E2364; --grid:rgba(255,255,255,.07); --doodle-o:.32; --text:#FFFFFF; --muted:#B9BBF0;
  --grass-a:#4BA35E; --grass-b:#419656; --card:#2B2F6B; --chip:#3C4194; --shadow:rgba(0,0,0,.4);
}
@media (max-height:520px){ :root{ --hud-h:64px; --pad-h:56px; } }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; }
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px;
  color:var(--text);
  font-family:Fredoka,"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
[hidden]{ display:none !important; }
button{ font-family:inherit; cursor:pointer; }
:focus-visible{ outline:4px solid var(--violet); outline-offset:3px; }

#mathbg{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:var(--doodle-o); }
#app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; overflow:hidden; }

/* top bar */
#hud{ height:var(--hud-h); flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 clamp(10px,2vw,28px); }
.round{
  width:clamp(44px,7vh,64px); aspect-ratio:1; border-radius:50%; border:0; background:var(--card); color:var(--text);
  font-size:clamp(20px,3.4vh,30px); display:grid; place-items:center; box-shadow:0 5px 0 var(--shadow); flex:none;
}
.round:active,.big:active,.chip:active,.pad-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--shadow); }
#target{ display:flex; align-items:center; gap:10px; background:var(--card); border-radius:28px; padding:4px 16px; box-shadow:0 5px 0 var(--shadow); min-width:0; }
#targetNum{ font-size:calc(var(--hud-h)*.56); font-weight:700; line-height:1; color:var(--pink); min-width:1.1em; text-align:center; }
#targetNum.pop{ animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop{ from{ transform:scale(.55); } to{ transform:scale(1); } }
#targetFruit{ font-size:clamp(14px,2.4vh,24px); max-width:12em; line-height:1.2; overflow-wrap:anywhere; }
@media (max-width:480px){ #targetNum{ font-size:40px; } #targetFruit{ font-size:15px; } #target{ padding:4px 12px; gap:8px; } }

/* board */
#stage{ flex:1 1 auto; min-height:0; display:grid; place-items:center; padding-bottom:14px; box-sizing:border-box; }
#board{
  display:block; border-radius:22px; touch-action:none;
  box-shadow:0 0 0 6px var(--card), 0 10px 0 6px var(--shadow);
}

/* steering buttons */
#pad{ flex:none; height:var(--pad-h); display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(8px,2vw,20px);
  width:min(100%,680px); box-sizing:border-box; margin:6px auto 18px; padding:0 clamp(10px,2vw,28px); }
.pad-btn{ border:0; border-radius:26px; color:#fff; display:grid; place-items:center; box-shadow:0 6px 0 rgba(0,0,0,.25); touch-action:none; }
.pad-btn svg{ width:44%; height:44%; }
.pad-btn[data-dir="left"] svg{ transform:rotate(0deg); }
.pad-btn[data-dir="up"] svg{ transform:rotate(90deg); }
.pad-btn[data-dir="right"] svg{ transform:rotate(180deg); }
.pad-btn[data-dir="down"] svg{ transform:rotate(270deg); }
.pad-btn[data-dir="left"]{ background:var(--orange); }
.pad-btn[data-dir="up"]{ background:var(--blue); }
.pad-btn[data-dir="down"]{ background:var(--violet); }
.pad-btn[data-dir="right"]{ background:var(--pink); }

/* menus */
#overlay{ position:absolute; inset:0; z-index:10; display:grid; place-items:center; padding:16px; overflow:auto;
  background:rgba(27,33,96,.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
.card{ background:var(--card); color:var(--text); border-radius:32px; padding:clamp(18px,3vh,30px); width:min(100%,520px);
  text-align:center; box-shadow:0 12px 0 var(--shadow); }
.card h1{ margin:0 0 6px; font-size:clamp(30px,6vw,44px); font-weight:700; line-height:1.1; }
.card h2{ margin:0 0 10px; font-size:clamp(28px,5vw,40px); font-weight:700; }
.card p{ margin:0 0 16px; color:var(--muted); font-size:clamp(15px,2.4vw,18px); }
.big{ border:0; border-radius:999px; background:var(--green); color:#fff; font-size:clamp(26px,5vw,36px); font-weight:700;
  padding:12px 40px; box-shadow:0 8px 0 rgba(0,0,0,.25); margin:4px 6px 12px; min-height:64px; }
.big.alt{ background:var(--blue); font-size:clamp(22px,4vw,28px); padding:10px 26px; min-height:56px; }
.opts{ display:grid; gap:12px; margin-top:6px; }
.grp{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
.grp span{ width:64px; text-align:right; color:var(--muted); font-size:15px; }
.chip{ border:0; border-radius:999px; background:var(--chip); color:var(--text); font-size:20px; font-weight:600; padding:8px 18px; min-height:48px; box-shadow:0 4px 0 var(--shadow); }
.chip[aria-pressed="true"]{ background:var(--yellow); color:#2B2A4C; }
.row{ display:flex; justify-content:center; flex-wrap:wrap; }

/* start screen mascot */
.mascot{ display:flex; justify-content:center; align-items:center; height:96px; margin-bottom:8px; }
.bub{ position:relative; width:62px; height:62px; margin-left:-10px; border-radius:50%; display:grid; place-items:center;
  border:4px solid var(--outline); color:#fff; font-size:30px; font-weight:700; text-shadow:0 2px 0 rgba(43,42,76,.55);
  animation:wave 1.6s ease-in-out infinite; animation-delay:calc(var(--i) * -.22s); }
.bub.head{ width:76px; height:76px; background:#2FCB63; }
.eye{ position:absolute; right:14px; width:18px; height:18px; border-radius:50%; border:3px solid var(--outline);
  background:radial-gradient(circle at 68% 50%, var(--outline) 34%, #fff 38%); }
.eye:nth-of-type(1){ top:12px; } .eye:nth-of-type(2){ bottom:12px; }
.tongue{ position:absolute; right:-20px; top:50%; width:20px; height:4px; margin-top:-2px; background:#FF4D6D; border-radius:2px; }
@keyframes wave{ 0%,100%{ transform:translateY(7px); } 50%{ transform:translateY(-9px); } }
@media (prefers-reduced-motion:reduce){ .bub{ animation:none; } #targetNum.pop{ animation:none; } }
</style>
</head>
<body>
<svg id="mathbg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="mp" width="420" height="420" patternUnits="userSpaceOnUse">
      <g font-family="Fredoka,'Trebuchet MS',sans-serif" font-weight="700" text-anchor="middle">
        <text x="50" y="90" font-size="56" fill="#FF5C8A" transform="rotate(-12 50 90)">+</text>
        <text x="170" y="65" font-size="50" fill="#FF8A3D" transform="rotate(10 170 65)">7</text>
        <text x="290" y="120" font-size="58" fill="#8B5CF6" transform="rotate(8 290 120)">×</text>
        <text x="372" y="52" font-size="52" fill="#3B82F6" transform="rotate(-8 372 52)">=</text>
        <text x="90" y="205" font-size="56" fill="#3B82F6" transform="rotate(-8 90 205)">÷</text>
        <text x="210" y="185" font-size="52" fill="#FF5C8A" transform="rotate(-6 210 185)">3</text>
        <text x="150" y="300" font-size="32" fill="#06B6D4" transform="rotate(6 150 300)">2 + 3 = 5</text>
        <text x="280" y="350" font-size="54" fill="#22B45A" transform="rotate(12 280 350)">π</text>
        <text x="380" y="340" font-size="50" fill="#FF8A3D" transform="rotate(-10 380 340)">9</text>
        <text x="205" y="400" font-size="48" fill="#8B5CF6">½</text>
        <text x="30" y="395" font-size="50" fill="#FFC93C" transform="rotate(8 30 395)">4</text>
      </g>
      <polygon points="300,262 362,262 331,208" fill="none" stroke="#FF8A3D" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="48" cy="305" r="24" fill="none" stroke="#8B5CF6" stroke-width="5"/>
      <rect x="92" y="352" width="38" height="38" rx="6" fill="none" stroke="#3B82F6" stroke-width="5" transform="rotate(14 111 371)"/>
      <path d="M375 150 l8 -16 l8 16 z" fill="none" stroke="#FF5C8A" stroke-width="4" stroke-linejoin="round"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#mp)"/>
</svg>
<div id="app">
  <header id="hud">
    <button class="round" id="btnPause" aria-label="Pause">⏸️</button>
    <div id="target" aria-live="polite">
      <div id="targetNum">1</div>
      <div id="targetFruit"></div>
    </div>
    <button class="round" id="btnSound" aria-label="Sound on or off">🔊</button>
  </header>

  <main id="stage"><canvas id="board" aria-label="Snake game board"></canvas></main>

  <section id="overlay">
    <div class="card" id="p-start">
      <div class="mascot" aria-hidden="true">
        <span class="bub" style="--i:3;background:#FFC93C">3</span>
        <span class="bub" style="--i:2;background:#FF8A3D">2</span>
        <span class="bub" style="--i:1;background:#FF5C8A">1</span>
        <span class="bub head" style="--i:0"><i class="eye"></i><i class="eye"></i><i class="tongue"></i></span>
      </div>
      <h1>Counting Snake</h1>
      <p>Eat the numbered fruit and watch your snake count!</p>
      <div class="row"><button class="big" id="btnPlay" aria-label="Play">▶ Play</button></div>
      <div class="opts">
        <div class="grp" role="group" aria-label="Counting range"><span>Count</span>
          <button class="chip" data-max="5">1–5</button>
          <button class="chip" data-max="10">1–10</button>
          <button class="chip" data-max="20">1–20</button></div>
        <div class="grp" role="group" aria-label="Speed"><span>Speed</span>
          <button class="chip" data-speed="slow" aria-label="Slow">🐢</button>
          <button class="chip" data-speed="fast" aria-label="Faster">🐇</button>
          <button class="chip" id="btnFull1" aria-label="Full screen"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      </div>
    </div>

    <div class="card" id="p-pause" hidden>
      <h2>Paused</h2>
      <div class="row">
        <button class="big" id="btnResume" aria-label="Resume">▶ Resume</button>
        <button class="big alt" id="btnHome1" aria-label="Home">🏠</button>
        <button class="big alt" id="btnFull2" aria-label="Full screen"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>

    <div class="card" id="p-win" hidden>
      <h2>Well done! 🎉</h2>
      <p id="winText"></p>
      <div class="row">
        <button class="big" id="btnAgain" aria-label="Play again">▶ Play again</button>
        <button class="big alt" id="btnHome2" aria-label="Home">🏠</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const canvas = $('#board'), ctx = canvas.getContext('2d');
const stage = $('#stage'), overlay = $('#overlay');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const COLORS = ['#FF5C8A','#FF8A3D','#FFC93C','#8B5CF6','#3B82F6','#EF4444','#D946EF','#06B6D4'];
const OUTLINE = '#2B2A4C';
const FONT = 'Fredoka, "Baloo 2", "Trebuchet MS", system-ui, sans-serif';
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FLY_MS = 600;

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x-1,3) + c1 * Math.pow(x-1,2); };
const mod = (v,m) => ((v % m) + m) % m;
const colorOf = n => COLORS[(n-1) % COLORS.length];

/* ---------- settings ---------- */
const cfg = { max:10, speed:'slow', sound:true };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('ginti-snake-cfg') || '{}')); } catch(e) {}
if (![5,10,20].includes(cfg.max)) cfg.max = 10;
if (!['slow','fast'].includes(cfg.speed)) cfg.speed = 'slow';
cfg.sound = cfg.sound !== false;
const saveCfg = () => { try { localStorage.setItem('ginti-snake-cfg', JSON.stringify(cfg)); } catch(e) {} };

/* ---------- theme colours for the canvas ---------- */
const T = { a:'#BDEE8F', b:'#A9E17C' };
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  T.a = cs.getPropertyValue('--grass-a').trim() || T.a;
  T.b = cs.getPropertyValue('--grass-b').trim() || T.b;
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme); } catch(e) {}

/* ---------- sound effects ---------- */
let actx = null;
function ac(){
  if (!cfg.sound) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur = .25, type = 'sine', vol = .22, delay = 0, slideTo){
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + .05);
}
const PENT = [0,2,4,7,9];
const noteFor = n => { const k = (n-1) % 10; return 261.63 * Math.pow(2, (PENT[k%5] + 12*Math.floor(k/5)) / 12); };
const sfxEat = n => { tone(720,.12,'sine',.25,0,240); tone(noteFor(n)*2,.4,'triangle',.22,.08); };
const sfxFanfare = () => [0,4,7,12,16].forEach((s,i) => tone(523.25*Math.pow(2,s/12),.4,'triangle',.22,i*.12));

/* ---------- number voice ---------- */
const NUM = { en:['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'] };
const PRAISE = { en:'Well done!' };
const SPEECH_OK = 'speechSynthesis' in window;
let voices = [];
function loadVoices(){ if (SPEECH_OK) voices = speechSynthesis.getVoices() || []; }
if (SPEECH_OK) { loadVoices(); try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch(e) {} }
function pickSet(){
  return { set:'en', voice: voices.find(v => /^en/i.test(v.lang)) || null };
}
function speak(kind, n, interrupt){
  return new Promise(res => {
    if (!cfg.sound || !SPEECH_OK) { res(); return; }
    try {
      const { set, voice } = pickSet();
      const u = new SpeechSynthesisUtterance(kind === 'praise' ? PRAISE[set] : NUM[set][n]);
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      else u.lang = 'en-US';
      u.rate = .8; u.pitch = 1.2;
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      u.onend = fin; u.onerror = fin; setTimeout(fin, 2600);
      if (interrupt) speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch(e) { res(); }
  });
}
const stopSpeech = () => { try { if (SPEECH_OK) speechSynthesis.cancel(); } catch(e) {} };

/* ---------- game state ---------- */
const G = {
  cols:8, rows:6, cell:64, dpr:1,
  snake:[], dir:[1,0], nextDir:[1,0], next:1, food:null, foodBorn:0,
  lastStep:0, stepMs:660, t:0, state:'menu', hl:-1, hlT:0, run:0,
  flyers:[], parts:[], flowers:[]
};

function layout(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = stage.clientWidth - 24, h = stage.clientHeight - 30;
  if (w < 100 || h < 100) return false;
  const cell = clamp(Math.round(Math.min(w, h) / 6.5), 40, 104);
  const cols = Math.max(5, Math.floor(w / cell)), rows = Math.max(4, Math.floor(h / cell));
  const changed = cols !== G.cols || rows !== G.rows;
  G.cell = cell; G.cols = cols; G.rows = rows; G.dpr = dpr;
  canvas.style.width = cols * cell + 'px';
  canvas.style.height = rows * cell + 'px';
  canvas.width = Math.round(cols * cell * dpr);
  canvas.height = Math.round(rows * cell * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (changed || !G.flowers.length) {
    G.flowers = [];
    const n = Math.round(cols * rows * .16);
    for (let i = 0; i < n; i++) G.flowers.push({ x: Math.random() * cols, y: Math.random() * rows, c: COLORS[i % COLORS.length] });
  }
  return changed;
}

function spawnFood(){
  const occ = new Set(G.snake.map(s => s.x + ',' + s.y));
  const head = G.snake[0];
  let x, y, tries = 0;
  do {
    x = Math.floor(Math.random() * G.cols); y = Math.floor(Math.random() * G.rows); tries++;
  } while ((occ.has(x + ',' + y) || Math.abs(x - head.x) + Math.abs(y - head.y) < 3) && tries < 300);
  G.food = { x, y, n: G.next };
  G.foodBorn = performance.now();
}

function updateHud(pop){
  const el = $('#targetNum');
  el.textContent = G.next;
  const tf = $('#targetFruit');
  tf.textContent = '★'.repeat(G.next);
  tf.style.color = colorOf(G.next);
  if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

function resetRound(){
  G.run++;
  const hx = Math.max(1, Math.floor(G.cols / 2) - 1), hy = Math.floor(G.rows / 2);
  G.snake = [{ x:hx, y:hy, px:hx, py:hy, num:0, showAt:0 }];
  G.dir = [1,0]; G.nextDir = [1,0]; G.next = 1; G.flyers = []; G.hl = -1; G.parts = [];
  G.stepMs = cfg.speed === 'fast' ? 420 : 660;
  G.lastStep = performance.now() + 150; G.t = 0;
  spawnFood(); updateHud(false);
}

function step(){
  const s = G.snake, head = s[0];
  let d = G.nextDir;
  const free = (x, y) => !s.slice(0, -1).some(p => p.x === x && p.y === y);
  let nx = mod(head.x + d[0], G.cols), ny = mod(head.y + d[1], G.rows);
  if (!free(nx, ny)) {
    // never crash: gently turn to a free side instead
    const alts = [[-d[1], d[0]], [d[1], -d[0]]];
    if (Math.random() < .5) alts.reverse();
    let found = false;
    for (const a of alts) {
      const ax = mod(head.x + a[0], G.cols), ay = mod(head.y + a[1], G.rows);
      if (free(ax, ay)) { d = a; nx = ax; ny = ay; found = true; break; }
    }
    if (!found) { s.forEach(p => { p.px = p.x; p.py = p.y; }); return; }
  }
  G.dir = d; G.nextDir = d;
  const tail = s[s.length - 1], tx = tail.x, ty = tail.y;
  for (const p of s) { p.px = p.x; p.py = p.y; }
  for (let i = s.length - 1; i > 0; i--) { s[i].x = s[i-1].px; s[i].y = s[i-1].py; }
  head.x = nx; head.y = ny;
  const f = G.food;
  if (f && head.x === f.x && head.y === f.y) eat(tx, ty);
}

function eat(tx, ty){
  const f = G.food, now = performance.now();
  const seg = { x:tx, y:ty, px:tx, py:ty, num:f.n, showAt: now + FLY_MS };
  G.snake.push(seg);
  G.flyers.push({ seg, n:f.n, x0:f.x + .5, y0:f.y + .5, start:now });
  burst(f.x + .5, f.y + .5, colorOf(f.n));
  sfxEat(f.n);
  speak('num', f.n, true);
  G.food = null;
  if (f.n >= cfg.max) { win(); }
  else { G.next = f.n + 1; spawnFood(); updateHud(true); }
}

async function win(){
  G.state = 'count';
  const run = ++G.run;
  await sleep(1300); if (G.run !== run) return;
  for (let i = 1; i < G.snake.length; i++) {
    G.hl = i; G.hlT = performance.now();
    const n = G.snake[i].num;
    tone(noteFor(n) * 2, .3, 'triangle', .2);
    await Promise.all([speak('num', n, false), sleep(650)]);
    if (G.run !== run) return;
  }
  G.hl = -1;
  sfxFanfare(); confettiRain();
  await Promise.all([speak('praise'), sleep(1000)]);
  if (G.run !== run) return;
  G.state = 'win';
  $('#winText').textContent = 'You counted from 1 to ' + cfg.max + '!';
  show('p-win');
}

/* ---------- particles ---------- */
function burst(x, y, color){
  const n = reduceMotion ? 6 : 20;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 2.6;
    G.parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1, g:4, life:0, max:.7 + Math.random()*.4,
      color: Math.random() < .5 ? color : '#FFFFFF', size:.05 + Math.random()*.06, shape:'c', rot:0, vr:0 });
  }
}
function confettiRain(){
  const n = reduceMotion ? 20 : 90;
  for (let i = 0; i < n; i++) {
    G.parts.push({ x:Math.random() * G.cols, y:-Math.random() * 3, vx:(Math.random() - .5) * .8, vy:1.4 + Math.random() * 2,
      g:0, life:0, max:3 + Math.random() * 1.5, color:COLORS[i % COLORS.length], size:.1 + Math.random()*.06,
      shape: Math.random() < .5 ? 'r' : 'c', rot:Math.random() * 6, vr:(Math.random() - .5) * 8 });
  }
}
function updateParticles(dt){
  for (const p of G.parts) { p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  G.parts = G.parts.filter(p => p.life < p.max);
  G.flyers = G.flyers.filter(f => performance.now() - f.start < FLY_MS + 30);
}

/* ---------- drawing ---------- */
function lerpPos(p, t){
  const dx = p.x - p.px, dy = p.y - p.py;
  if (Math.abs(dx) > 1.5 || Math.abs(dy) > 1.5) return [p.x, p.y];
  return [p.px + dx * t, p.py + dy * t];
}
function drawNumber(txt, x, y, size){
  ctx.font = `700 ${size}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .2; ctx.strokeStyle = OUTLINE;
  ctx.strokeText(txt, x, y + size * .04);
  ctx.fillStyle = '#fff'; ctx.fillText(txt, x, y + size * .04);
}
function drawBoard(){
  const c = G.cell;
  for (let r = 0; r < G.rows; r++) for (let q = 0; q < G.cols; q++) {
    ctx.fillStyle = (r + q) % 2 ? T.a : T.b;
    ctx.fillRect(q * c, r * c, c, c);
  }
  for (const f of G.flowers) {
    const x = f.x * c, y = f.y * c, r = c * .05;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (let k = 0; k < 5; k++) { const a = k * 1.2566; ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 1.5, y + Math.sin(a) * r * 1.5, r, 0, 7); ctx.fill(); }
    ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
}
function starPath(r1, r2, pts){
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / pts;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function drawFood(ts){
  const f = G.food; if (!f) return;
  const c = G.cell;
  const sc = easeOutBack(clamp((ts - G.foodBorn) / 350, 0, 1));
  const bob = reduceMotion ? 0 : Math.sin(ts / 280) * c * .04;
  const wob = reduceMotion ? 0 : Math.sin(ts / 420) * .1;
  const cx = (f.x + .5) * c, cy = (f.y + .5) * c + bob;
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(cx, (f.y + .5) * c + c * .4, c * .28 * sc, c * .07 * sc, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  ctx.save(); ctx.rotate(wob);
  starPath(c * .56, c * .28, 5);
  ctx.fillStyle = colorOf(f.n); ctx.strokeStyle = OUTLINE; ctx.lineWidth = c * .06; ctx.lineJoin = 'round';
  ctx.fill(); ctx.stroke();
  ctx.restore();
  drawNumber(String(f.n), 0, c * .03, c * (f.n > 9 ? .32 : .42));
  ctx.restore();
}
function segScale(p, i, ts){
  let sc = 1;
  if (i > 0 && p.showAt && ts < p.showAt + 350) sc = easeOutBack(clamp((ts - p.showAt) / 350, 0, 1));
  if (i === G.hl) sc *= 1.2 + .06 * Math.sin(ts / 90);
  return sc;
}
function drawSnake(ts){
  const s = G.snake, c = G.cell, R = c * .42;
  const P = s.map(p => lerpPos(p, G.t));
  const vis = s.map((p, i) => i === 0 || ts >= p.showAt);
  const sc = s.map((p, i) => segScale(p, i, ts));
  const linked = i => vis[i] && vis[i-1] && Math.hypot(P[i][0] - P[i-1][0], P[i][1] - P[i-1][1]) < 1.6;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // outline pass
  ctx.strokeStyle = OUTLINE; ctx.fillStyle = OUTLINE;
  for (let i = s.length - 1; i >= 1; i--) {
    if (!vis[i]) continue;
    const x = (P[i][0] + .5) * c, y = (P[i][1] + .5) * c;
    if (linked(i)) {
      ctx.lineWidth = R * 1.7 + c * .1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo((P[i-1][0] + .5) * c, (P[i-1][1] + .5) * c); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y, R * sc[i] + c * .05, 0, 7); ctx.fill();
  }
  // colour pass
  for (let i = s.length - 1; i >= 1; i--) {
    if (!vis[i]) continue;
    const x = (P[i][0] + .5) * c, y = (P[i][1] + .5) * c;
    ctx.fillStyle = ctx.strokeStyle = colorOf(s[i].num);
    if (linked(i)) {
      ctx.lineWidth = R * 1.7;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo((P[i-1][0] + .5) * c, (P[i-1][1] + .5) * c); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y, R * sc[i], 0, 7); ctx.fill();
  }
  // numbers
  for (let i = 1; i < s.length; i++) {
    if (!vis[i]) continue;
    const n = s[i].num;
    drawNumber(String(n), (P[i][0] + .5) * c, (P[i][1] + .5) * c, c * (n > 9 ? .34 : .44) * sc[i]);
  }
  drawHead((P[0][0] + .5) * c, (P[0][1] + .5) * c, ts);
}
function drawHead(x, y, ts){
  const c = G.cell, a = Math.atan2(G.dir[1], G.dir[0]);
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  if (Math.sin(ts / 380) > .55) {
    ctx.strokeStyle = '#FF4D6D'; ctx.lineWidth = c * .06; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c * .44, 0); ctx.lineTo(c * .72, 0);
    ctx.moveTo(c * .72, 0); ctx.lineTo(c * .82, -c * .08);
    ctx.moveTo(c * .72, 0); ctx.lineTo(c * .82, c * .08); ctx.stroke();
  }
  ctx.fillStyle = '#2FCB63'; ctx.strokeStyle = OUTLINE; ctx.lineWidth = c * .05;
  ctx.beginPath(); ctx.arc(0, 0, c * .5, 0, 7); ctx.fill(); ctx.stroke();
  for (const sy of [-1, 1]) {
    ctx.fillStyle = '#fff'; ctx.lineWidth = c * .04;
    ctx.beginPath(); ctx.arc(c * .13, sy * c * .2, c * .15, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = OUTLINE;
    ctx.beginPath(); ctx.arc(c * .18, sy * c * .2, c * .075, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = c * .05; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(c * .17, 0, c * .15, -Math.PI * .35, Math.PI * .35); ctx.stroke();
  ctx.restore();
}
function drawFlyers(ts){
  const c = G.cell;
  for (const f of G.flyers) {
    const k = clamp((ts - f.start) / FLY_MS, 0, 1), e = k * k * (3 - 2 * k);
    const t = lerpPos(f.seg, G.t);
    const x = (f.x0 + (t[0] + .5 - f.x0) * e) * c;
    const y = (f.y0 + (t[1] + .5 - f.y0) * e - Math.sin(k * Math.PI) * .9) * c;
    const r = c * .42 * (1.2 - .2 * k);
    ctx.fillStyle = OUTLINE; ctx.beginPath(); ctx.arc(x, y, r + c * .05, 0, 7); ctx.fill();
    ctx.fillStyle = colorOf(f.n); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    drawNumber(String(f.n), x, y, c * (f.n > 9 ? .34 : .44));
  }
}
function drawParticles(){
  const c = G.cell;
  for (const p of G.parts) {
    ctx.globalAlpha = clamp((p.max - p.life) / (p.max * .3), 0, 1);
    ctx.fillStyle = p.color;
    const x = p.x * c, y = p.y * c, r = p.size * c;
    if (p.shape === 'c') { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
    else { ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.fillRect(-r, -r * .6, r * 2, r * 1.2); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
}
function draw(ts){
  ctx.clearRect(0, 0, G.cols * G.cell, G.rows * G.cell);
  drawBoard(); drawFood(ts); drawSnake(ts); drawFlyers(ts); drawParticles();
}

/* ---------- main loop ---------- */
let lastTs = performance.now();
function frame(ts){
  const dt = Math.min(.05, (ts - lastTs) / 1000); lastTs = ts;
  if (G.state === 'play' && ts - G.lastStep >= G.stepMs) {
    step(); G.lastStep += G.stepMs;
    if (ts - G.lastStep > G.stepMs) G.lastStep = ts;
  }
  if (G.state !== 'paused') G.t = clamp((ts - G.lastStep) / G.stepMs, 0, 1);
  updateParticles(dt);
  draw(ts);
  requestAnimationFrame(frame);
}

/* ---------- steering ---------- */
function setDir(d){
  if (G.state !== 'play') return;
  const cur = G.dir;
  if (G.snake.length > 1 && d[0] === -cur[0] && d[1] === -cur[1]) return;
  G.nextDir = d;
}
const axisDir = (dx, dy) => Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy) || 1];
function tapSteer(cx, cy){
  const r = canvas.getBoundingClientRect(), h = G.snake[0];
  const dx = cx - (r.left + (h.x + .5) * G.cell), dy = cy - (r.top + (h.y + .5) * G.cell);
  let d = axisDir(dx, dy);
  if (G.snake.length > 1 && d[0] === -G.dir[0] && d[1] === -G.dir[1]) {
    d = d[0] !== 0 ? [0, Math.sign(dy) || 1] : [Math.sign(dx) || 1, 0];
  }
  setDir(d);
}
let ptr = null;
canvas.addEventListener('pointerdown', e => { ptr = { x:e.clientX, y:e.clientY, done:false }; try { canvas.setPointerCapture(e.pointerId); } catch(_) {} ac(); });
canvas.addEventListener('pointermove', e => {
  if (!ptr || ptr.done) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (Math.hypot(dx, dy) > 28) { ptr.done = true; setDir(axisDir(dx, dy)); }
});
canvas.addEventListener('pointerup', e => { if (ptr && !ptr.done) tapSteer(e.clientX, e.clientY); ptr = null; });
canvas.addEventListener('pointercancel', () => { ptr = null; });

const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { arrowup:'up', w:'up', arrowdown:'down', s:'down', arrowleft:'left', a:'left', arrowright:'right', d:'right' };
  if (map[k]) { e.preventDefault(); setDir(DIRS[map[k]]); }
  else if (k === ' ' || k === 'p') {
    if (G.state === 'play') { e.preventDefault(); pause(); }
    else if (G.state === 'paused') { e.preventDefault(); resume(); }
  }
});

/* ---------- menus ---------- */
function show(id){
  overlay.hidden = false;
  ['p-start','p-pause','p-win'].forEach(p => { $('#' + p).hidden = p !== id; });
}
function startGame(){
  ac();
  if (SPEECH_OK) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e) {} }
  stopSpeech();
  overlay.hidden = true;
  layout(); resetRound();
  G.state = 'play';
}
function pause(){ if (G.state !== 'play') return; G.state = 'paused'; show('p-pause'); }
function resume(){ if (G.state !== 'paused') return; overlay.hidden = true; G.lastStep = performance.now() - G.t * G.stepMs; G.state = 'play'; }
function goHome(){ stopSpeech(); layout(); resetRound(); G.state = 'menu'; show('p-start'); }
function toggleFull(){
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } catch(e) {}
}
function refreshChips(){
    document.querySelectorAll('[data-max]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.max === cfg.max));
  document.querySelectorAll('[data-speed]').forEach(b => b.setAttribute('aria-pressed', b.dataset.speed === cfg.speed));
  $('#btnSound').textContent = cfg.sound ? '🔊' : '🔇';
}
document.querySelectorAll('[data-max]').forEach(b => b.addEventListener('click', () => { cfg.max = +b.dataset.max; saveCfg(); refreshChips(); }));
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => { cfg.speed = b.dataset.speed; saveCfg(); refreshChips(); }));
$('#btnSound').addEventListener('click', () => { cfg.sound = !cfg.sound; saveCfg(); if (!cfg.sound) stopSpeech(); else ac(); refreshChips(); });
$('#btnPlay').addEventListener('click', startGame);
$('#btnAgain').addEventListener('click', startGame);
$('#btnPause').addEventListener('click', () => { if (G.state === 'play') pause(); });
$('#btnResume').addEventListener('click', resume);
$('#btnHome1').addEventListener('click', goHome);
$('#btnHome2').addEventListener('click', goHome);
$('#btnFull1').addEventListener('click', toggleFull);
$('#btnFull2').addEventListener('click', toggleFull);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pause(); });

let resizeQueued = false;
new ResizeObserver(() => {
  if (resizeQueued) return; resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    if (layout()) {
      const wasCounting = G.state === 'count';
      resetRound();
      if (wasCounting) { G.state = 'menu'; show('p-start'); }
    }
  });
}).observe(stage);

/* ---------- init ---------- */
readTheme(); refreshChips();
try { document.fonts && document.fonts.load('700 40px Fredoka'); } catch(e) {}
layout(); resetRound(); show('p-start');
requestAnimationFrame(frame);
})();
</script>
</body>
